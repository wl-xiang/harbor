name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture for Docker images'
        required: true
        default: 'arm64'
        type: choice
        options:
          - amd64
          - arm64

env:
  DOCKER_COMPOSE_VERSION: 2.27.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: src/github.com/goharbor/harbor

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache-dependency-path: src/github.com/goharbor/harbor/src/go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup environment
        run: |
          cd src/github.com/goharbor/harbor
          echo "GOPATH=$(go env GOPATH):$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "TOKEN_PRIVATE_KEY_PATH=${GITHUB_WORKSPACE}/src/github.com/goharbor/harbor/tests/private_key.pem" >> $GITHUB_ENV
          
          # Install docker-compose
          curl -L https://github.com/docker/compose/releases/download/v${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m) > docker-compose
          chmod +x docker-compose
          sudo mv docker-compose /usr/local/bin

      - name: Build Harbor images
        run: |
          cd src/github.com/goharbor/harbor
          
          # Set architecture
          ARCH=${{ github.event.inputs.arch }}
          if [ "$ARCH" = "arm64" ]; then
            MAKE_ARCH="arm64"
          else
            MAKE_ARCH="amd64"
          fi
          
          # Generate versions file required by Docker build
          sudo -E make versions_prepare VERSIONTAG=${{ github.run_number }}
          
          # Build images for the target architecture
          # Using BUILD_BASE=false to use existing base images from Docker Hub
          # TRIVYFLAG=true to include trivy-adapter
          # EXPORTERFLAG=true to include exporter
          sudo -E make build \
            ARCH=${MAKE_ARCH} \
            VERSIONTAG=${{ github.run_number }} \
            BUILD_BASE=false \
            TRIVYFLAG=true \
            EXPORTERFLAG=true \
            HTTPPROXY=
          
          echo "ARCH=${MAKE_ARCH}" >> $GITHUB_ENV
          echo "VERSIONTAG=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Generate docker-compose.yml
        run: |
          cd src/github.com/goharbor/harbor
          
          # Copy harbor.yml.tmpl to harbor.yml for prepare
          cp make/harbor.yml.tmpl make/harbor.yml
          
          # Run prepare to generate docker-compose.yml
          # This will process harbor.yml.tmpl and generate the final docker-compose.yml
          sudo -E make prepare \
            TRIVYFLAG=true \
            EXPORTERFLAG=true
          
          # Verify docker-compose.yml was generated
          if [ ! -f make/docker-compose.yml ]; then
            echo "ERROR: docker-compose.yml was not generated"
            exit 1
          fi
          
          echo "docker-compose.yml generated successfully"

      - name: Pack source files
        run: |
          cd src/github.com/goharbor/harbor
          
          # Create source tarball with docker-compose.yml and any .env files
          mkdir -p harbor-source
          cp make/docker-compose.yml harbor-source/
          
          # Copy .env file if it exists
          if [ -f make/.env ]; then
            cp make/.env harbor-source/
          fi
          
          # Create source tarball
          tar -czf harbor-${{ env.ARCH }}-source.tgz -C harbor-source .
          
          echo "Source tarball created: harbor-${{ env.ARCH }}-source.tgz"

      - name: Pack Docker images
        run: |
          cd src/github.com/goharbor/harbor
          
          # Get list of all harbor images with the version tag
          IMAGES=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^(goharbor/|goharbor/harbor-)' | grep ":${{ env.VERSIONTAG }}$" || true)
          
          if [ -z "$IMAGES" ]; then
            echo "ERROR: No Harbor images found with tag ${{ env.VERSIONTAG }}"
            docker images
            exit 1
          fi
          
          echo "Packing the following images:"
          echo "$IMAGES"
          
          # Save all images to tarball
          docker save $IMAGES | gzip > harbor-${{ env.ARCH }}-docker-images.tgz
          
          echo "Docker images tarball created: harbor-${{ env.ARCH }}-docker-images.tgz"
          ls -lh harbor-${{ env.ARCH }}-docker-images.tgz

      - name: Pack distribution tarball
        run: |
          cd src/github.com/goharbor/harbor
          
          # Create distribution directory
          mkdir -p harbor-dist
          
          # Copy both tarballs into distribution
          cp harbor-${{ env.ARCH }}-source.tgz harbor-dist/
          cp harbor-${{ env.ARCH }}-docker-images.tgz harbor-dist/
          
          # Create final distribution tarball
          tar -czf harbor-${{ env.ARCH }}-dist.tgz -C harbor-dist .
          
          echo "Distribution tarball created: harbor-${{ env.ARCH }}-dist.tgz"
          ls -lh harbor-${{ env.ARCH }}-dist.tgz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-${{ env.ARCH }}-dist
          path: src/github.com/goharbor/harbor/harbor-${{ env.ARCH }}-dist.tgz
          retention-days: 30
